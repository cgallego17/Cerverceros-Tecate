{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Panel — Cerveceros de Tecate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/panel.css' %}">
</head>
<body class="panel-body">

<div class="panel-login-page">
    <div class="panel-login-card">

        <div class="panel-login-logo">
            <img src="{% static 'images/logo.png' %}" alt="Cerveceros de Tecate" class="panel-login-logo-img">
            <div class="panel-login-logo-sub">Panel de Control</div>
        </div>

        {% if error %}
        <div class="panel-login-error">{{ error }}</div>
        {% endif %}

        <form method="post" class="panel-login-form" autocomplete="off">
            {% csrf_token %}
            <div class="panel-login-form-group">
                <label class="panel-login-label" for="username">Usuario</label>
                <input class="panel-login-input" type="text" id="username" name="username"
                       placeholder="Nombre de usuario" required autofocus>
            </div>
            <div class="panel-login-form-group">
                <label class="panel-login-label" for="password">Contraseña</label>
                <input class="panel-login-input" type="password" id="password" name="password"
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="panel-login-submit">Ingresar al panel</button>
        </form>

    </div>
</div>

</body>
</html>
